services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-to-postgres-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: system
      APP_USER_PASSWORD: oracle
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:17-alpine
    container_name: oracle-to-postgres-postgres
    environment:
      POSTGRES_DB: oracletopostgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oracletopostgres"]
      interval: 10s
      timeout: 5s
      retries: 10
