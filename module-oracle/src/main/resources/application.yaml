spring:
  application:
    name: module-oracle
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:system}
    password: ${ORACLE_PASSWORD:oracle}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  liquibase:
    change-log: classpath:/db/changelog/database-changelog-master.xml

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
