spring:
  application:
    name: module-postgres
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/oracletopostgres}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/database-changelog-master.xml

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
